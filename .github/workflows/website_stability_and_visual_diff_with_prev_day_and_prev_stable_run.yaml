name: Website Stability and Visual Diff (Previous Day & Stable Baseline)

on:
  schedule:
    # Runs daily at 1:00 AM IST (19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  nightly-check:
    name: Uptime & Visual Inspection
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install @playwright/test
          npx playwright install --with-deps chromium

      # 1. Restore Yesterday's Output from Cache
      - name: Restore Previous Run Snapshot
        uses: actions/cache/restore@v4
        with:
          path: snapshots/today-run.png
          key: sahyadri-daily-snapshot-${{ github.sha }}
          restore-keys: |
            sahyadri-daily-snapshot-

      # 2. Prepare Yesterday Snapshot for Test (Windows PowerShell Native)
      - name: Prepare Yesterday Snapshot for Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path snapshots
          if (Test-Path "snapshots/today-run.png") {
            Copy-Item "snapshots/today-run.png" "snapshots/prev-run.png" -Force
            Write-Host "Successfully restored yesterday's snapshot as prev-run.png"
          }

      # 3. Execute Uptime & Visual Tests
      - name: Run Playwright Visual Tests
        run: npx playwright test

      # 4. Save Today's New Snapshot to Cache for Tomorrow
      - name: Save Today Snapshot for Tomorrow
        if: success()
        uses: actions/cache/save@v4
        with:
          path: snapshots/today-run.png
          key: sahyadri-daily-snapshot-${{ github.run_id }}

      # 5. Upload Snapshots on Every Run
      - name: Upload Snapshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: snapshots/
          retention-days: 7
        with:
          name: visual-diff-report
          path: test-results/
          retention-days: 7
